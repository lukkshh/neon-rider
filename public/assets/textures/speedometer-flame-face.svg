    <g fill="none" stroke-linecap="round">
      <path d="M151 190l96-22 M712 154l118 24 M116 804l76-12 M762 838l111-31 M358 128l49-11 M570 884l91-20" stroke="#d0d4d5" stroke-opacity=".12" stroke-width="2" />
      <path d="M268 115l32-7 M840 650l51-13 M99 450l36-8 M480 921l58-13 M604 108l30-7 M911 483l26-6" stroke="#07090a" stroke-opacity=".28" stroke-width="3" />
