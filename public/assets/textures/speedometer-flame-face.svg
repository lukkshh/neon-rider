    <!-- Engraved highlights define the swept flame curls without raising contrast. -->
    <g fill="none" stroke="#85898a" stroke-linecap="round" stroke-linejoin="round" opacity=".18">
      <path d="M104 608 C181 555 201 469 221 414 C242 355 278 343 310 365 C336 382 333 408 316 421" stroke-width="7" />
      <path d="M222 630 C291 590 310 524 352 485 C393 447 424 461 438 489" stroke-width="6" />
