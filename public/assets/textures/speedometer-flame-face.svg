<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="metal" cx="36%" cy="27%" r="78%">
      <stop offset="0" stop-color="#55585a" />
      <stop offset=".34" stop-color="#3c3f41" />
      <stop offset=".72" stop-color="#282b2d" />
      <stop offset="1" stop-color="#17191b" />
    </radialGradient>
    <linearGradient id="brush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e4e5" stop-opacity=".035" />
      <stop offset=".48" stop-color="#07090a" stop-opacity=".06" />
      <stop offset="1" stop-color="#d1d5d6" stop-opacity=".018" />
    </linearGradient>
    <radialGradient id="edge-shade" cx="50%" cy="48%" r="54%">
      <stop offset=".76" stop-color="#080a0b" stop-opacity="0" />
      <stop offset="1" stop-color="#07090a" stop-opacity=".52" />
    </radialGradient>
    <pattern id="fine-brush" width="9" height="31" patternUnits="userSpaceOnUse">
      <path d="M1 0v31 M5 0v31" stroke="#d5d9da" stroke-opacity=".035" stroke-width=".7" />
      <path d="M8 0v31" stroke="#090b0c" stroke-opacity=".09" stroke-width=".8" />
    </pattern>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72 .035" numOctaves="2" seed="17" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncR type="table" tableValues=".27 .73" />
        <feFuncG type="table" tableValues=".27 .73" />
        <feFuncB type="table" tableValues=".27 .73" />
        <feFuncA type="table" tableValues="0 .16" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light" />
    </filter>
    <clipPath id="dial-circle"><circle cx="512" cy="512" r="510" /></clipPath>
  </defs>

  <g clip-path="url(#dial-circle)">
    <rect width="1024" height="1024" fill="url(#metal)" />
    <rect width="1024" height="1024" fill="url(#fine-brush)" opacity=".65" />
    <rect width="1024" height="1024" fill="url(#brush)" />

